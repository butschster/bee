version: '1.0'
namespace: bee.workspace
entries:
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  modules: [security, tty, process, channel, time, uuid]
  imports:
    model: bee.desktop:model
    decode: bee.protocol:decode
    decode_input: bee.protocol:input
    appearance: bee.desktop:appearance
    chrome: bee.terminal:chrome
  meta:
    command:
      name: bee
      short: Open the Bee workspace desktop
      security:
        actor: {id: bee.local}
        policies: [bee:desktop_policy]

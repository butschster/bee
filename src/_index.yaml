version: '1.0'
namespace: bee
entries:
- name: definition
  kind: ns.definition
  meta:
    title: Bee desktop foundation
- name: workers
  kind: process.host
  host:
    max_processes: 24
    workers: 4
  lifecycle:
    auto_start: true
- name: app_policy
  kind: security.policy
  policy:
    actions: '*'
    resources: '*'
    effect: deny
- name: broker_policy
  kind: security.policy
  policy:
    actions:
    - tty.mount
    - tty.observe
    - tty.input
    - tty.resize
    - process.spawn
    - process.spawn.monitored
    - process.context
    - process.host
    - process.send
    - process.monitor
    - process.terminate
    - process.cancel
    - registry.get
    - process.security
    - security.scope.create
    - security.policy.get
    resources: '*'
    effect: allow
- name: settings_policy
  kind: security.policy
  policy:
    actions:
    - tty.observe
    - tty.input
    - tty.resize
    - process.send
    resources: '*'
    effect: allow
- name: processes_policy
  kind: security.policy
  policy:
    actions: [system.read]
    resources: [hosts, memory, goroutines, supervisor]
    effect: allow
- name: desktop_policy
  kind: security.policy
  policy:
    actions:
    - tty.mount
    - tty.observe
    - tty.input
    - tty.resize
    - process.spawn
    - process.spawn.monitored
    - process.send
    - process.monitor
    - process.terminate
    - process.cancel
    - process.host
    - process.context
    - process.security
    - security.scope.create
    - security.policy.get
    resources: '*'
    effect: allow
- name: presenter_policy
  kind: security.policy
  policy:
    actions: [tty.observe, tty.input, tty.resize, process.send, process.monitor]
    resources: '*'
    effect: allow
- name: session_policy
  kind: security.policy
  policy:
    actions:
    - process.send
    - process.monitor
    resources: '*'
    effect: allow
- name: application_admission
  kind: registry.entry
  definitions: [bee.settings:app, bee.processes:app]
- name: terminal
  kind: terminal.host
  hide_logs: true
  lifecycle:
    auto_start: true

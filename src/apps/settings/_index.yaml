version: '1.0'
namespace: bee.settings
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [tty, process, channel, uuid]
  imports:
    appearance: bee.desktop:appearance
    view: bee.settings:view
  meta:
    type: bee.application
    application:
      api_version: 1
      title: Settings
      icon: S
      lifetime: view
- name: view
  kind: library.lua
  source: file://view.lua
  modules: [tty]
  imports:
    appearance: bee.desktop:appearance
